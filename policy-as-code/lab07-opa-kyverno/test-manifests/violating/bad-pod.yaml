apiVersion: v1
kind: Pod
metadata:
  name: bad-policy-test-pod
  namespace: default
spec:
  containers:
    - name: bad-container
      image: alpine:3.19
      command: ["sh", "-c", "sleep 3600"]
      securityContext:
        privileged: true
        runAsUser: 0
        allowPrivilegeEscalation: true
      volumeMounts:
        - name: host-root
          mountPath: /host
  volumes:
    - name: host-root
      hostPath:
        path: /
        type: Directory
