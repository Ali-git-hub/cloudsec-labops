title = "CloudSec LabOps Gitleaks Config"

[allowlist]
description = "Allow fake examples only when explicitly marked"
paths = [
  '''secrets/lab08-secrets-detection/secure/app.env.example'''
]

[[rules]]
id = "aws-access-key"
description = "AWS Access Key"
regex = '''AKIA[0-9A-Z]{16}'''
tags = ["aws", "key"]

[[rules]]
id = "github-token"
description = "GitHub token"
regex = '''ghp_[0-9A-Za-z]{36}'''
tags = ["github", "token"]

[[rules]]
id = "slack-webhook"
description = "Slack webhook"
regex = '''https://hooks\.slack\.com/services/[A-Za-z0-9_/]+'''
tags = ["slack", "webhook"]

[[rules]]
id = "database-url-with-password"
description = "Database URL containing credentials"
regex = '''postgres://[^:\s]+:[^@\s]+@[^/\s]+/[^\s]+'''
tags = ["database", "password"]

[[rules]]
id = "stripe-secret-key"
description = "Stripe secret key"
regex = '''sk_live_[0-9A-Za-z]+'''
tags = ["stripe", "secret"]
