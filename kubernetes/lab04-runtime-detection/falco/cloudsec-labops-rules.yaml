- rule: CloudSec LabOps Shell Spawned In Container
  desc: Detect interactive shell execution inside a container.
  condition: >
    spawned_process and container and
    proc.name in (sh, bash, zsh, ash)
  output: >
    Shell spawned inside container
    (user=%user.name command=%proc.cmdline container=%container.name image=%container.image.repository pod=%k8s.pod.name namespace=%k8s.ns.name)
  priority: WARNING
  tags: [container, shell, mitre_execution]

- rule: CloudSec LabOps Host Filesystem Access From Container
  desc: Detect access to host filesystem mounted inside a container.
  condition: >
    open_read and container and fd.name startswith /host
  output: >
    Container accessed mounted host filesystem
    (user=%user.name file=%fd.name command=%proc.cmdline container=%container.name pod=%k8s.pod.name namespace=%k8s.ns.name)
  priority: CRITICAL
  tags: [container, hostpath, privilege_escalation]

- rule: CloudSec LabOps Package Manager Used In Container
  desc: Detect package manager execution inside a running container.
  condition: >
    spawned_process and container and
    proc.name in (apk, apt, apt-get, yum, dnf, rpm)
  output: >
    Package manager executed inside container
    (user=%user.name command=%proc.cmdline container=%container.name pod=%k8s.pod.name namespace=%k8s.ns.name)
  priority: WARNING
  tags: [container, persistence, defense_evasion]
